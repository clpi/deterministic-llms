name: xhw-compare
# Scores finished audit runs (out/xhw/ci-runs.json names them) and prints the
# full summaries to the job log, so the results can be read without the artifacts.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/xhw-compare.yml
      - out/xhw/ci-runs.json
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install numpy==2.5.3
      - id: ids
        run: |
          echo "main=$(python -c "import json;print(json.load(open('out/xhw/ci-runs.json'))['xhw'])")" >> "$GITHUB_OUTPUT"
          echo "ink=$(python -c "import json;print(json.load(open('out/xhw/ci-runs.json'))['xhw-ink'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: {pattern: "hf-*", path: hf, run-id: "${{ steps.ids.outputs.main }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {pattern: "gpt2-*", path: g2, run-id: "${{ steps.ids.outputs.main }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {pattern: "hf-INK-*", path: ink, run-id: "${{ steps.ids.outputs.ink }}", github-token: "${{ github.token }}"}
        continue-on-error: true
      - name: Summaries
        run: |
          cd harness
          python xhw_hf.py compare ../XHW-HF-SUMMARY.json ../hf || true
          python xhw.py compare ../XHW-GPT2-SUMMARY.json ../g2 ../out/xhw/runs ../out/xhw/runs-again || true
          python xhw_ink.py compare ../XHW-INK-SUMMARY.json ../ink || true
          python xhw_controls.py ../XHW-CONTROLS-SUMMARY.json ../hf ../g2 ../ink ../out/xhw/runs ../out/xhw/runs-again || true
          for f in ../XHW-*-SUMMARY.json; do echo "=== $f"; python -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1]))))" "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: xhw-summaries, path: "XHW-*-SUMMARY.json"}
