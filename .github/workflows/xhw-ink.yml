name: xhw-ink
# Inkling 2 Mini row of the cross-hardware audit (tasks/XHW_AMEND_2.json):
# smallest Unsloth GGUF through llama.cpp b12699, Linux runners only.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/xhw-ink.yml
      - harness/xhw_ink.py
      - harness/xhw_llama.cpp
env:
  LLAMA_TAG: b12699
  XHW_LLAMA_TAG: b12699
jobs:
  traj:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install numpy==2.5.3 huggingface_hub
      - name: Build llama.cpp and the driver
        run: |
          git clone -q --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/lb" -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build "$RUNNER_TEMP/lb" --target llama -j4
          g++ -O2 -std=c++17 harness/xhw_llama.cpp -I"$RUNNER_TEMP/llama.cpp/include" -I"$RUNNER_TEMP/llama.cpp/ggml/include" -L"$RUNNER_TEMP/lb/bin" -lllama -Wl,-rpath,"$RUNNER_TEMP/lb/bin" -o "$RUNNER_TEMP/xhw_llama"
          echo "XHW_LLAMA=$RUNNER_TEMP/xhw_llama" >> "$GITHUB_ENV"
      - run: cd harness && python xhw_ink.py traj ../xhw-ref
      - uses: actions/upload-artifact@v4
        with: {name: "ref-INK", path: xhw-ref/, retention-days: 30}

  run:
    needs: traj
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install numpy==2.5.3 huggingface_hub
      - uses: actions/download-artifact@v4
        with: {name: "ref-INK", path: xhw-ref}
      - name: Build llama.cpp and the driver
        run: |
          git clone -q --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/lb" -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build "$RUNNER_TEMP/lb" --target llama -j4
          g++ -O2 -std=c++17 harness/xhw_llama.cpp -I"$RUNNER_TEMP/llama.cpp/include" -I"$RUNNER_TEMP/llama.cpp/ggml/include" -L"$RUNNER_TEMP/lb/bin" -lllama -Wl,-rpath,"$RUNNER_TEMP/lb/bin" -o "$RUNNER_TEMP/xhw_llama"
          echo "XHW_LLAMA=$RUNNER_TEMP/xhw_llama" >> "$GITHUB_ENV"
      - name: Lean
        run: |
          arch=$([ "$(uname -m)" = "aarch64" ] && echo linux_aarch64 || echo linux)
          curl -sSL -o "$RUNNER_TEMP/lean.tar.zst" "https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-$arch.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$HOME"
          echo "$HOME/lean-4.19.0-$arch/bin" >> "$GITHUB_PATH"
      - run: bash lean/check.sh
      - name: Audit (threads 4 and 1), then threads 4 again in a fresh process
        run: |
          cd harness
          python xhw_ink.py run ${{ matrix.os }} ../xhw-ref ../xhw-out --configs ALL --lean
          python xhw_ink.py run ${{ matrix.os }} ../xhw-ref ../xhw-again --configs reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "hf-INK-${{ matrix.os }}"
          path: |
            xhw-out/*.json
            xhw-again/*.json

  compare:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install numpy==2.5.3
      - uses: actions/download-artifact@v4
        with: {pattern: "hf-INK-*", path: hf}
      - run: cd harness && python xhw_ink.py compare ../XHW-INK-SUMMARY.json ../hf
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: xhw-ink-summary, path: XHW-INK-SUMMARY.json}
